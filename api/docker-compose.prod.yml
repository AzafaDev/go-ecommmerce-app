services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: goecommercedb
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations then exits. `up` is idempotent, so
  # this is safe to run on every `docker compose up`.
  migrate:
    image: migrate/migrate:v4.17.1
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=${DATABASE_URL}
      - up

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # godotenv.Load() (internal/config/config.go) requires a real .env file
    # on disk — env_file: alone would set process env but not satisfy that.
    volumes:
      - ./.env:/app/.env:ro
    # Bound to loopback only — Caddy on the same host reverse-proxies to
    # this port, nothing needs to reach it directly from outside.
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  db_data:
  redis_data:
